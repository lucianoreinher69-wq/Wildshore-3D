name: Build Wildshore 3D Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/realistic-island-terrain]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Bundle Three.js for offline play
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Force landscape orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s, count = re.subn(r'<activity\b(?![^>]*android:screenOrientation=)', '<activity android:screenOrientation="sensorLandscape"', s, count=1)
          if count != 1:
              raise SystemExit("Could not set the main Android activity to landscape")
          p.write_text(s)
          PY
      - name: Configure permanent Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/wildshore-release.jks
          echo "Decoded keystore size: $(wc -c < android/wildshore-release.jks) bytes"
          if ! keytool -list -keystore android/wildshore-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1; then
            echo "Keystore validation failed. Check the saved Base64, password, and alias."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          import os
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s, count = re.subn(r'(versionCode\s+)\d+', lambda m: m.group(1) + os.environ['VERSION_CODE'], s, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionCode")
          s += """

          // Use the same password for store and key: this is a PKCS12 keystore.
          android {
              signingConfigs {
                  release {
                      storeFile file("../wildshore-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          """
          p.write_text(s)
          PY
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease
      - name: Verify APK signature
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wildshore3D-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
